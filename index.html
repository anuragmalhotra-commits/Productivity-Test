<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InSight Productivity Field Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2420; --paper:#f7f2ea; --card:#ffffff;
    --accent:#8a5a3b; --accent-deep:#5f3b24; --line:#e2d8c8;
    --good:#4c7a5e; --bad:#b3503f; --muted:#8a7f6f; --warn:#b3823f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Karla',sans-serif;
        min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  body.lang-hi{ font-family:'Noto Sans Devanagari','Karla',sans-serif; }
  .topbar{ width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px; }
  .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:1.02rem; color:var(--accent-deep); }
  .lang-toggle{ display:flex; border:1.5px solid var(--accent); border-radius:999px; overflow:hidden; }
  .lang-toggle button{ border:none; background:transparent; padding:6px 14px; font-family:inherit; font-size:0.85rem; cursor:pointer; color:var(--accent-deep); }
  .lang-toggle button.active{ background:var(--accent); color:#fff; }
  .status-bar{ width:100%; max-width:640px; padding:0 20px; display:flex; gap:8px; flex-wrap:wrap; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:0.72rem; padding:4px 10px; border-radius:999px; margin-top:6px; }
  .pill-ok{ background:#e5efe8; color:var(--good); }
  .pill-pending{ background:#faf1e2; color:var(--warn); }
  .pill-off{ background:#f1eadf; color:var(--muted); }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .progress-wrap{ width:100%; max-width:640px; padding:10px 20px 0; }
  .progress-track{ height:5px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .25s ease; }
  .progress-label{ font-size:0.75rem; color:var(--muted); margin:6px 2px 0; }
  .stage{ width:100%; max-width:640px; flex:1; padding:18px 20px 120px; }
  .section-tag{ font-size:0.78rem; color:var(--accent); font-weight:700; margin-bottom:10px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:0 1px 2px rgba(60,45,25,0.04); }
  .qtext{ font-family:'Fraunces',serif; font-weight:500; font-size:1.28rem; line-height:1.4; margin:0 0 6px; white-space:pre-line; }
  body.lang-hi .qtext{ font-family:'Noto Sans Devanagari',serif; font-weight:500; }
  .qid-badge{ font-size:0.7rem; color:var(--muted); font-weight:700; letter-spacing:.03em; }
  .options{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .opt-btn{ text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-family:inherit; font-size:0.98rem; cursor:pointer; color:var(--ink); transition:border-color .15s, background .15s; }
  .opt-btn:hover{ border-color:var(--accent); }
  .opt-btn.selected{ border-color:var(--accent); background:#f3e8dd; font-weight:600; }
  input[type=text]{ width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; font-size:1rem; margin-top:12px; }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .grid-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .grid-row:last-child{ border-bottom:none; }
  .grid-label{ font-size:0.93rem; flex:1; }
  .grid-choices{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip{ padding:6px 11px; border-radius:999px; border:1.3px solid var(--line); background:#fff; font-size:0.78rem; cursor:pointer; white-space:nowrap; }
  .chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .check-item:last-child{ border-bottom:none; }
  .check-box{ width:19px;height:19px;flex:none;margin-top:2px; border:1.5px solid var(--accent); border-radius:5px; display:flex;align-items:center;justify-content:center; font-size:12px;color:#fff; }
  .check-box.on{ background:var(--accent); }
  .occ-label{ font-weight:700; font-size:0.85rem; color:var(--accent-deep); margin-bottom:8px; }
  .footer-bar{ position:fixed; bottom:0; left:0; right:0; background:linear-gradient(to top, var(--paper) 60%, transparent); padding:22px 0 18px; display:flex; justify-content:center; }
  .footer-inner{ width:100%; max-width:640px; display:flex; justify-content:space-between; padding:0 20px; gap:12px; }
  .btn{ font-family:inherit; font-size:0.95rem; font-weight:700; padding:12px 22px; border-radius:10px; border:none; cursor:pointer; }
  .btn-primary{ background:var(--accent-deep); color:#fff; flex:1; }
  .btn-primary:disabled{ background:#c9bda9; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--accent-deep); border:1.5px solid var(--line); }
  .end-screen{ padding:60px 20px; max-width:640px; text-align:center; }
  .end-screen h1{ font-family:'Fraunces',serif; font-size:1.9rem; color:var(--accent-deep); }
  .summary-box{ text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:24px; max-height:380px; overflow-y:auto; font-size:0.82rem; }
  .summary-row{ padding:6px 0; border-bottom:1px dashed var(--line); }
  .summary-row b{ color:var(--accent-deep); }
  .setup-warning{ background:#fdf0e3; border:1px solid #e8c79a; border-radius:10px; padding:12px 14px; font-size:0.82rem; margin-top:16px; text-align:left; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">InSight — Productivity Field Test</div>
  <div class="lang-toggle">
    <button id="btn-en" class="active" onclick="setLang('en')">English</button>
    <button id="btn-hi" onclick="setLang('hi')">हिंदी</button>
  </div>
</div>
<div class="status-bar">
  <span class="status-pill" id="syncPill"></span>
  <span class="status-pill" id="geoPill"></span>
</div>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="stage" id="stage"></div>

<div class="footer-bar" id="footerBar">
  <div class="footer-inner">
    <button class="btn btn-ghost" id="backBtn" onclick="goBack()">Back</button>
    <button class="btn btn-primary" id="nextBtn" onclick="goNext()">Continue</button>
  </div>
</div>

<script>

const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyA439T2-8H2cn0XlQfxHy-SNVil-_yfq7H3Rn2C6EhuRw_CTsXAN8jjnHxozi3lBp6/exec';
// ============================================================

const QUEUE_KEY = 'insight_productivity_pending_queue';
const QUESTIONS = [{"id": "Q1", "sectionEn": "Consent", "sectionHi": "सहमति", "en": "You are invited to participate in a study assessing the adoption and use of near-vision glasses as part of the InSight Program. All information you provide will be kept strictly confidential. Your name and contact details will be stored separately from your survey answers on an access-controlled roster, and will not be shared outside the research team.", "hi": "इनसाइट प्रोग्राम के तहत पास की नजर के चश्मे के इस्तेमाल को समझने के लिए आपको इस सर्वे में आमंत्रित किया गया है। \n आपके द्वारा दी गई सभी जानकारी पूरी तरह गुप्त रखी जाएगी। आपका नाम और फोन नंबर आपके जवाबों से अलग एक \n सुरक्षित लिस्ट में रहेगा और इसे रिसर्च टीम के अलावा किसी से साझा नहीं किया जाएगा।", "kind": "display"}, {"id": "Q2", "sectionEn": "Consent", "sectionHi": "सहमति", "en": "Do you agree to participate in the survey?", "hi": "क्या आप इस सर्वे में हिस्सा लेने के लिए तैयार हैं?", "kind": "yesno", "endIfNo": true}, {"id": "Q8", "sectionEn": "Interview & Location Identification", "sectionHi": "साक्षात्कार एवं स्थान की जानकारी", "en": "Enterprise Name", "hi": "आपकी दुकान / काम-धंधे या कंपनी का नाम", "kind": "text"}, {"id": "Q10", "sectionEn": "Interview & Location Identification", "sectionHi": "साक्षात्कार एवं स्थान की जानकारी", "en": "Participant Full Name", "hi": "आपका पूरा नाम", "kind": "text"}, {"id": "Q32", "sectionEn": "Interview & Location Identification", "sectionHi": "साक्षात्कार एवं स्थान की जानकारी", "en": "What is your MAIN occupation / type of work?", "hi": "आपका मुख्य काम या रोज़गार क्या है?", "kind": "select", "optsEn": ["Handloom weaver (fabric making)", "Zari/zardozi worker (Banarsi Sari making)", "Chikankari/embroidery worker", "Wooden Toy maker", "Rug making", "Meenakari artisan", "Other"], "optsHi": ["हथकरघा बुनकर (कपड़ा बनाना)", "जरी/जरदोजी कारीगर (बनारसी साड़ी या कढ़ाई करना)", "चिकनकारी/कढ़ाई कारीगर", "लकड़ी के खिलौने बनाने वाले", "गलीचा/कालीन बनाने वाले", "मीनाकारी कारीगर", "अन्य"], "optionCodes": [ // ---- Location capture ----
// Requires HTTPS (or localhost). Browsers block geolocation on plain
// file:// or http:// origins, so this quietly no-ops there instead of
// breaking the interview — location fields just come back empty.
let geoStatus = 'idle';   // idle | requesting | ok | denied | unavailable
let geoData = null;       // { lat, lng, accuracy }

function requestLocation(){
  if(!('geolocation' in navigator)){
    geoStatus = 'unavailable'; updateGeoPill(); return;
  }
  geoStatus = 'requesting'; updateGeoPill();
  navigator.geolocation.getCurrentPosition(
    pos => {
      geoData = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };
      geoStatus = 'ok'; updateGeoPill();
    },
    err => { geoStatus = (err.code === 1 ? 'denied' : 'unavailable'); updateGeoPill(); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
  );
}

function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxyyyy-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

function setLang(l){
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-hi').classList.toggle('active', l==='hi');
  document.body.classList.toggle('lang-hi', l==='hi');
  updateGeoPill();
  render();
}

function evalSkip(expr, a){
  if(!expr) return false;
  try{ return Function('a', 'return (' + expr + ');')(a); }catch(e){ return false; }
}
function visibleQuestions(){ return QUESTIONS.filter(q => !evalSkip(q.skip, answers)); }
function currentQuestion(){ return visibleQuestions()[idx]; }

function substUnit(text){
  const unit = (answers.Q42 || 'unit').toLowerCase();
  return text.replace(/\[units?\]/gi, unit);
}
function substUnitHi(text){
  const unit = (answers.Q42_hi || answers.Q42 || 'इकाई');
  return text.replace(/\[इकाई\]/g, unit).replace(/\[unit\]/gi, unit);
}
function substPay(text){
  const map = {'Per piece':'per piece','Per unit (e.g. per metre)':'per unit','Daily wage':'per day','Monthly salary':'per month','Other':'per (specify)'};
  const val = map[answers.Q46] || 'per [unit/day/month]';
  return text.replace(/\[selected payment type[^\]]*\]/i, val);
}

function render(){
  const t = L[lang];
  const stage = document.getElementById('stage');
  const vis = visibleQuestions();

  if(ended){
    document.querySelector('.progress-wrap').style.display='none';
    document.getElementById('footerBar').style.display='none';
    let extra = '';
    if(endedReason==='done' && (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_YOUR') === 0)){
      extra = `<div class="setup-warning">⚠ No Apps Script URL is set yet, so this response is only queued locally, not sent anywhere.</div>`;
    }
    stage.innerHTML = `
      <div class="end-screen">
        <h1>${endedReason==='consent' ? t.endTitle : t.doneTitle}</h1>
        <p>${endedReason==='consent' ? t.endSubtitle : t.doneSubtitle}</p>
        ${endedReason!=='consent' ? renderSummary() : ''}
        ${extra}
        <button class="btn btn-primary" style="margin-top:24px;" onclick="restart()">${t.restart}</button>
      </div>`;
    return;
  }

  document.querySelector('.progress-wrap').style.display='block';
  document.getElementById('footerBar').style.display='flex';

  const q = vis[idx];
  if(!q){ finish(); return; }

  const pct = Math.round((idx/Math.max(vis.length,1))*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = t.progress(idx+1, vis.length);

  const sectionLabel = lang==='en' ? q.sectionEn : q.sectionHi;
  let qText = lang==='en' ? q.en : q.hi;
  if(q.unitTemplate) qText = lang==='en' ? substUnit(qText) : substUnitHi(qText);
  if(q.payTemplate) qText = substPay(qText);

  let bodyHtml = '';
  if(q.kind === 'display'){
    bodyHtml = `<p style="font-size:0.98rem;line-height:1.6;">${qText}</p>`;
  } else if(q.kind === 'yesno'){
    bodyHtml = renderOptions(q.id, ['Yes','No'], ['हां','नहीं']);
  } else if(q.kind === 'select'){
    bodyHtml = renderOptions(q.id, q.optsEn, q.optsHi);
  } else if(q.kind === 'multiselect'){
    bodyHtml = renderMultiOptions(q.id, q.optsEn, q.optsHi);
  } else if(q.kind === 'text'){
    const val = answers[q.id] || '';
    bodyHtml = `<input type="text" id="input-${q.id}" value="${val.replace(/"/g,'&quot;')}" placeholder="${t.typePrompt}" oninput="answers['${q.id}']=this.value; refreshNextBtn();">`;
  } else if(q.kind === 'select_dynamic'){
    const src = answers.Q38 || [];
    const custom = answers.Q38_other;
    let items = src.slice();
    if(custom) items.push(custom);
    if(items.length===0) items = ['(no tasks marked at Q38 — go back)'];
    bodyHtml = renderOptions(q.id, items, items);
  } else if(q.kind === 'occ_checklist'){
    const occCode = answers.Q32code;
    const entry = occCode ? q.occMap[occCode] : null;
    if(!entry){
      bodyHtml = `<p style="color:var(--bad);font-size:0.9rem;">No occupation selected yet — go back to Q32.</p>`;
    } else if(occCode === '7'){
      const val = answers[q.id+'_other'] || '';
      bodyHtml = `<div class="occ-label">${lang==='en'?entry.label_en:entry.label_hi}</div>
        <input type="text" id="input-${q.id}_other" value="${val.replace(/"/g,'&quot;')}" placeholder="${t.typePrompt}"
          oninput="answers['${q.id}_other']=this.value; answers['${q.id}']=[this.value]; refreshNextBtn();">`;
    } else {
      const itemsE = entry.items_en, itemsH = entry.items_hi;
      const sel = answers[q.id+'_std'] || [];
      const otherOn = !!answers[q.id+'_otherOn'];
      const otherText = answers[q.id+'_otherText'] || '';
      bodyHtml = `<div class="occ-label">${lang==='en'?entry.label_en:entry.label_hi}</div>`;
      itemsE.forEach((it, i) => {
        const label = lang==='en' ? it : (itemsH[i]||it);
        const on = sel.includes(it);
        bodyHtml += `<div class="check-item" onclick="toggleOccStd('${q.id}','${it.replace(/'/g,"\\'")}')">
          <div class="check-box ${on?'on':''}">${on?'✓':''}</div><div>${label}</div></div>`;
      });
      bodyHtml += `<div class="check-item" onclick="toggleOccOtherFlag('${q.id}')">
        <div class="check-box ${otherOn?'on':''}">${otherOn?'✓':''}</div><div>${lang==='en'?'Other (specify)':'अन्य (बताएं)'}</div></div>`;
      if(otherOn){
        bodyHtml += `<input type="text" id="input-${q.id}_otherText" value="${otherText.replace(/"/g,'&quot;')}" placeholder="${t.typePrompt}"
          oninput="updateOccOtherText('${q.id}', this.value);">`;
      }
    }
  } else if(q.kind === 'qty_period'){
    const qtyKey = q.id+'_qty', periodKey = q.id+'_period', customKey = q.id+'_qtyCustomOn';
    const qtyVal = answers[qtyKey] !== undefined ? answers[qtyKey] : '';
    const customOn = !!answers[customKey];
    const periodVal = answers[periodKey] || '';
    const selectStyle = 'width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-size:1rem;margin-top:8px;background:#fff;';

    let qtySelect = `<select id="select-${q.id}-qty" onchange="handleQtySelect('${q.id}', this.value)" style="${selectStyle}">`;
    qtySelect += `<option value="" ${(!customOn && qtyVal==='')?'selected':''}>${lang==='en'?'Select a number':'एक संख्या चुनें'}</option>`;
    q.qtyOptions.forEach(n => {
      const sel = (!customOn && String(qtyVal)===String(n)) ? 'selected' : '';
      qtySelect += `<option value="${n}" ${sel}>${n}</option>`;
    });
    const maxOpt = q.qtyOptions[q.qtyOptions.length-1];
    qtySelect += `<option value="__more__" ${customOn?'selected':''}>${lang==='en'?'More than '+maxOpt+' (type exact number)':maxOpt+' से ज्यादा (सही संख्या लिखें)'}</option>`;
    qtySelect += `</select>`;
    if(customOn){
      qtySelect += `<input type="text" inputmode="numeric" id="input-${q.id}-qtyCustom" value="${(qtyVal||'').toString().replace(/"/g,'&quot;')}" placeholder="${lang==='en'?'Type exact number':'सही संख्या लिखें'}"
        style="margin-top:8px;" oninput="answers['${qtyKey}']=this.value; refreshNextBtn();">`;
    }

    let periodSelect = `<select id="select-${q.id}-period" onchange="answers['${periodKey}']=this.value; refreshNextBtn();" style="${selectStyle}">`;
    periodSelect += `<option value="" ${periodVal===''?'selected':''}>${lang==='en'?'Select a period':'समय अवधि चुनें'}</option>`;
    q.periodOptsEn.forEach((p,i) => {
      const label = lang==='en' ? p : q.periodOptsHi[i];
      const sel = periodVal===p ? 'selected' : '';
      periodSelect += `<option value="${p}" ${sel}>${label}</option>`;
    });
    periodSelect += `</select>`;

    bodyHtml = `<div style="font-size:0.85rem;color:var(--muted);">${lang==='en'?'How many:':'कितने:'}</div>${qtySelect}
      <div style="margin-top:14px;font-size:0.85rem;color:var(--muted);">${lang==='en'?'Per:':'प्रति:'}</div>${periodSelect}`;
  }

  stage.innerHTML = `
    <div class="section-tag">${sectionLabel}</div>
    <div class="card">
      <div class="qid-badge">${q.id}</div>
      <p class="qtext">${qText}</p>
      ${bodyHtml}
    </div>`;

  document.getElementById('backBtn').style.visibility = idx===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = (idx === vis.length-1) ? t.finish : t.continue;
  refreshNextBtn();
}

function renderOptions(qid, optsE, optsH){
  const cur = answers[qid];
  return `<div class="options">` + optsE.map((o,i) => {
    const label = lang==='en' ? o : (optsH[i]||o);
    const sel = cur === o;
    return `<button class="opt-btn ${sel?'selected':''}" onclick="selectOption('${qid}','${o.replace(/'/g,"\\'")}')">${label}</button>`;
  }).join('') + `</div>`;
}
function renderMultiOptions(qid, optsE, optsH){
  const cur = answers[qid] || [];
  return `<div class="options">` + optsE.map((o,i) => {
    const label = lang==='en' ? o : (optsH[i]||o);
    const on = cur.includes(o);
    return `<div class="check-item" onclick="toggleMulti('${qid}','${o.replace(/'/g,"\\'")}')">
      <div class="check-box ${on?'on':''}">${on?'✓':''}</div><div>${label}</div></div>`;
  }).join('') + `</div>`;
}

function selectOption(qid, val){
  answers[qid] = val;
  if(qid === 'Q32'){
    const q = QUESTIONS.find(x=>x.id==='Q32');
    const i = q.optsEn.indexOf(val);
    answers.Q32code = q.optionCodes[i];
  }
  if(qid === 'Q42'){
    const q = QUESTIONS.find(x=>x.id==='Q42');
    const i = q.optsEn.indexOf(val);
    answers.Q42_hi = q.optsHi[i];
  }
  render();
}
function toggleMulti(qid, val){
  if(!answers[qid]) answers[qid] = [];
  const arr = answers[qid];
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  render();
}
// --- occupation-checklist helpers (standard items + free-text "Other") ---
function syncOccAnswer(qid){
  const std = answers[qid+'_std'] || [];
  const combined = std.slice();
  if(answers[qid+'_otherOn'] && (answers[qid+'_otherText']||'').trim()){
    combined.push(answers[qid+'_otherText'].trim());
  }
  answers[qid] = combined;
}
function toggleOccStd(qid, val){
  if(!answers[qid+'_std']) answers[qid+'_std'] = [];
  const arr = answers[qid+'_std'];
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  syncOccAnswer(qid);
  render();
}
function toggleOccOtherFlag(qid){
  answers[qid+'_otherOn'] = !answers[qid+'_otherOn'];
  syncOccAnswer(qid);
  render();
}
function updateOccOtherText(qid, val){
  answers[qid+'_otherText'] = val;
  syncOccAnswer(qid);
  refreshNextBtn();
}
function handleQtySelect(qid, val){
  if(val === '__more__'){
    answers[qid+'_qtyCustomOn'] = true;
    answers[qid+'_qty'] = '';
  } else {
    answers[qid+'_qtyCustomOn'] = false;
    answers[qid+'_qty'] = val;
  }
  render();
}

function refreshNextBtn(){
  const q = currentQuestion();
  const btn = document.getElementById('nextBtn');
  if(!q){ btn.disabled=false; return; }
  let answered = true;
  if(q.kind==='display') answered = true;
  else if(q.kind==='text') answered = !!(answers[q.id] && answers[q.id].toString().trim());
  else if(q.kind==='select' || q.kind==='yesno' || q.kind==='select_dynamic') answered = answers[q.id] !== undefined;
  else if(q.kind==='multiselect') answered = (answers[q.id]||[]).length>0;
  else if(q.kind==='occ_checklist'){
    if(answers.Q32code==='7') answered = !!(answers[q.id+'_other'] && answers[q.id+'_other'].trim());
    else answered = (answers[q.id]||[]).length>0;
  }
  else if(q.kind==='qty_period'){
    const qty = answers[q.id+'_qty'];
    const period = answers[q.id+'_period'];
    answered = !!(qty !== undefined && qty.toString().trim() !== '' && period);
  }
  btn.disabled = !answered;
}

function goNext(){
  const q = currentQuestion();
  if(q.id === 'Q2'){
    if(answers.Q2 === 'No'){ ended=true; endedReason='consent'; render(); return; }
    // consent given — kick off location capture now (first user gesture)
    requestLocation();
  }
  const vis = visibleQuestions();
  if(idx >= vis.length-1){ finish(); return; }
  idx++; render();
}
function goBack(){ if(idx>0){ idx--; render(); } }

function finish(){
  submissionId = submissionId || uuid();
  const payload = Object.assign({ submissionId, submittedAt: new Date().toISOString() }, answers);
  if(geoData){
    payload.locationLat = geoData.lat;
    payload.locationLng = geoData.lng;
    payload.locationAccuracyM = Math.round(geoData.accuracy);
  }
  payload.locationStatus = geoStatus;
  queueAndSend(payload);
  ended = true; endedReason='done'; render();
}
function restart(){
  answers = {}; idx = 0; ended=false; endedReason=''; submissionId=null;
  geoStatus='idle'; geoData=null; updateGeoPill();
  render();
}

function renderSummary(){
  let rows = '';
  visibleQuestions().forEach(q => {
    let v;
    if(q.kind === 'qty_period'){
      const qty = answers[q.id+'_qty'], period = answers[q.id+'_period'];
      if(qty===undefined && !period) return;
      v = `${qty||'—'} per ${period||'—'}`;
    } else {
      v = answers[q.id];
      if(v===undefined) return;
      if(Array.isArray(v)) v = v.join(', ');
    }
    rows += `<div class="summary-row"><b>${q.id}</b> — ${(lang==='en'?q.en:q.hi).split('\\n')[0]}: ${v}</div>`;
  });
  if(geoData){
    rows += `<div class="summary-row"><b>Location</b> — ${geoData.lat.toFixed(5)}, ${geoData.lng.toFixed(5)} (±${Math.round(geoData.accuracy)}m)</div>`;
  }
  return `<div class="summary-box">${rows}</div>`;
}

// ---------- Google Sheet sync (with offline queue) ----------
function loadQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }catch(e){ return []; }
}
function saveQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

function queueAndSend(payload){
  const q = loadQueue();
  q.push(payload);
  saveQueue(q);
  flushQueue();
}

function flushQueue(){
  updateSyncPill();
  if(!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_YOUR') === 0) return;
  const q = loadQueue();
  if(q.length === 0) return;
  const next = q[0];
  fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify(next) })
    .then(() => {
      const remaining = loadQueue().filter(item => item.submissionId !== next.submissionId);
      saveQueue(remaining);
      updateSyncPill();
      if(remaining.length > 0) flushQueue();
    })
    .catch(() => { updateSyncPill(); });
}

function updateSyncPill(){
  const pill = document.getElementById('syncPill');
  if(!pill) return;
  const n = loadQueue().length;
  const t = L[lang];
  if(n === 0){
    pill.className = 'status-pill pill-ok';
    pill.innerHTML = `<span class="dot"></span> ${t.syncOk}`;
  } else {
    pill.className = 'status-pill pill-pending';
    pill.innerHTML = `<span class="dot"></span> ${t.syncPending(n)}`;
  }
}

function updateGeoPill(){
  const pill = document.getElementById('geoPill');
  if(!pill) return;
  const t = L[lang];
  const map = {
    idle:       {cls:'pill-off', text: null},
    requesting: {cls:'pill-pending', text: t.geoReq},
    ok:         {cls:'pill-ok', text: t.geoOk},
    denied:     {cls:'pill-off', text: t.geoDenied},
    unavailable:{cls:'pill-off', text: t.geoUnavail}
  };
  const s = map[geoStatus];
  if(!s.text){ pill.style.display='none'; return; }
  pill.style.display='inline-flex';
  pill.className = 'status-pill ' + s.cls;
  pill.innerHTML = `<span class="dot"></span> ${s.text}`;
}

window.addEventListener('online', flushQueue);
setInterval(flushQueue, 20000);

updateSyncPill();
updateGeoPill();
render();
</script>
